name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restore
        run: dotnet restore DSLuaDecompiler/DSLuaDecompiler.csproj
      - name: Publish
        run: dotnet publish DSLuaDecompiler/DSLuaDecompiler.csproj --configuration Release --no-restore --output artifacts/DSLuaDecompiler
      - uses: actions/upload-artifact@v4
        with:
          name: DSLuaDecompiler
          path: artifacts/DSLuaDecompiler/
